# Nginx config for local fietsroute deployment.
# Serves the built routeplanner frontend at / and proxies /api to the API server.

server {
    listen 80 default_server;
    listen 8011;
    server_name _;

    root /workspace/project/fietsroute/artifacts/routeplanner/dist/public;

    # API server proxy
    location /api {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # Network route data can be large — allow generous timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        send_timeout 120s;
    }

    # Serve static frontend files
    location / {
        try_files $uri $uri/ /index.html;
        # Cache static assets for a day, but invalidate on rebuild
        location ~* \.(js|css|svg|png|jpg|jpeg|gif|ico|woff|woff2|ttf|eot)$ {
            expires 1d;
            add_header Cache-Control "public, immutable";
        }
    }
}
